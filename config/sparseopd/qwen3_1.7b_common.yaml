---
hydra:
  searchpath:
  - pkg://verl.trainer.config
defaults:
- ppo_trainer
- _self_
sparseopd:
  experiment_prefix: qwen3_1.7b_from_qwen3_4b_instruct_2507
  output_dir: output
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
data:
  train_files:
  - "${oc.env:SPARSEOPD_REPO_ROOT}/dataset/dapo-math-17k-dedup.parquet"
  val_files: "${.train_files}"
  train_batch_size: 128
  val_batch_size: 1
  train_max_samples: -1
  val_max_samples: 1
  max_prompt_length: 1024
  max_response_length: 8192
  prompt_key: prompt
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 16
  truncation: error
  shuffle: true
  seed: 42
  dataloader_num_workers: 8
  apply_chat_template_kwargs:
    enable_thinking: false
actor_rollout_ref:
  hybrid_engine: true
  model:
    path: "path/to/Qwen3-1.7B"
    use_remove_padding: true
    enable_gradient_checkpointing: true
    use_shm: false
    trust_remote_code: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 64
    ppo_epochs: 1
    use_torch_compile: true
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 24576
    loss_agg_mode: token-mean
    use_kl_loss: false
    entropy_coeff: 0.0
    optim:
      lr: 1.0e-06
      lr_warmup_steps_ratio: 0.0
      weight_decay: 0.0
      lr_scheduler_type: constant
    fsdp_config:
      param_offload: false
      optimizer_offload: false
      model_dtype: bf16
      use_orig_params: false
    checkpoint:
      save_contents:
      - model
      - optimizer
      - extra
      load_contents: "${.save_contents}"
  rollout:
    name: vllm
    mode: async
    n_gpus_per_node: 4
    tensor_model_parallel_size: 1
    data_parallel_size: 1
    gpu_memory_utilization: 0.25
    dtype: bfloat16
    load_format: dummy
    max_model_len: 9217
    max_num_batched_tokens: 32768
    max_num_seqs: 32
    prompt_length: 1024
    response_length: 8192
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 1
    do_sample: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 32768
    free_cache_engine: false
    enable_chunked_prefill: true
    enable_prefix_caching: true
    engine_kwargs:
      vllm:
        seed: 42
distillation:
  enabled: true
  n_gpus_per_node: 4
  nnodes: 1
  distillation_loss:
    loss_mode: k1
    use_task_rewards: false
    use_policy_gradient: true
    policy_loss_mode: vanilla
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    loss_max_clamp: 
    log_prob_min_clamp: 
    sparse_opd_mode: dense
    sparse_opd_loss_agg_mode: paper-seq-mean-token-mean
  teacher_models:
    teacher_model:
      key: dapo_math
      model_path: "path/to/Qwen3-4B-Instruct-2507"
      num_replicas: 0
      inference:
        name: vllm
        tensor_model_parallel_size: 1
        data_parallel_size: 1
        pipeline_model_parallel_size: 1
        dtype: bfloat16
        gpu_memory_utilization: 0.6
        enforce_eager: true
        load_format: auto
        max_num_batched_tokens: 32768
        max_num_seqs: 32
        max_model_len: 9217
        enable_chunked_prefill: true
        enable_prefix_caching: true
        prompt_length: 1024
        response_length: 8192
        temperature: 1.0
trainer:
  gpu_monitor:
    enabled: true
    sample_interval_s: 2.0
  total_epochs: 2
  total_training_steps: 
  project_name: sparseopd_dense_opd
  logger:
  - console
  - tensorboard
  - file
  log_val_generations: 0
  validation_data_dir: 
  nnodes: 1
  n_gpus_per_node: 4
  save_freq: 50
  resume_mode: auto
  resume_from_path: 
  val_before_train: false
  val_only: false
  test_freq: -1
  default_hdfs_dir: 
  max_actor_ckpt_to_keep: 3
  max_critic_ckpt_to_keep: 1
  device: cuda
